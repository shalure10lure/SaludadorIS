<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Bot Saludador</title>
  </head>
  <body>
    <h1>Hola</h1>
    <form id="saluda-form">
      <label for="nombre">Tu nombre:</label>
      <input type="text" id="nombre" />

      <br><br>

      <label for="genero">Tu género:</label>
      <select id="genero">
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>

      <br><br>

      <label for="edad">Tu edad:</label>
      <input type="number" id="edad" />

      <br><br>

      <label for="idioma">Idioma:</label>
      <select id="idioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
      </select>

      <br><br>

      <input type="submit" value="Saludar" id="saludar-button" />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
